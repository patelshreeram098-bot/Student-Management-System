<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Management System</h1>
        <p>My First Website Project</p>
    </header>

    <div class="container">

        <h2>Add Student</h2>

        <input
            type="text"
            id="name"
            placeholder="Enter student name"
        >

        <input
            type="number"
            id="age"
            placeholder="Enter age"
        >

        <input
            type="text"
            id="course"
            placeholder="Enter course"
        >

        <button onclick="addStudent()">
            Add Student
        </button>


        <h2>Student List</h2>

        <table>

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Course</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentList">
            </tbody>

        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
